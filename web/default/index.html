<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="TjQLAxdEJhvU1R6OSs8s0AkoyIyGS9fwmbdE2jx9M6I"
    />

    <!-- Primary Meta Tags -->
    <title>Vancine</title>
    <meta name="title" content="Vancine" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#090909" />
    <!--
      Pre-paint theme bootstrap. Runs synchronously (no defer/async) before the
      first frame to avoid a white flash (FOUC) for dark-mode users. Mirrors
      ThemeProvider's resolution order (cookie dark > light > system) but reads
      the `vite-ui-theme` cookie directly, since ThemeProvider only applies the
      class in a post-mount useEffect. Keep in sync with
      src/lib/theme-bootstrap.ts (resolveInitialTheme).
    -->
    <script>
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)
          var stored = m ? decodeURIComponent(m[1]) : null
          var dark
          if (stored === 'dark') dark = true
          else if (stored === 'light') dark = false
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#090909' : '#ffffff')
        } catch (e) {}
      })()
    </script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="8701f14b-abd5-481a-ad21-8d0fb7abcd94"
      data-domains="vancine.com,www.vancine.com"
      data-do-not-track="true"
      data-performance="true"
    ></script>
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
