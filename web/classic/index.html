<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="google-site-verification"
      content="TjQLAxdEJhvU1R6OSs8s0AkoyIyGS9fwmbdE2jx9M6I"
    />
    <!--
      Default theme-color matches ThemeProvider's default actual theme (dark).
      The inline sync script below rewrites this before first paint when the
      visitor has a saved light/auto preference.
    -->
    <meta name="theme-color" content="#090909" />
    <meta
      name="description"
      lang="zh"
      content="统一的 AI 模型聚合与分发网关，支持将各类大语言模型跨格式转换为 OpenAI、Claude、Gemini 兼容接口，为个人与企业提供集中式模型管理与网关服务。"
    />
    <meta
      name="description"
      lang="en"
      content="A unified AI model hub for aggregation & distribution. It supports cross-converting various LLMs into OpenAI-compatible, Claude-compatible, or Gemini-compatible formats. A centralized gateway for personal and enterprise model management."
    />
    <meta name="generator" content="vancine" />
    <title>Vancine</title>
    <!--
      Synchronous boot-theme probe. Mirrors ThemeProvider
      (src/context/Theme/index.jsx):
        localStorage['theme-mode'] || 'dark'
        actual = mode === 'auto' ? prefers-color-scheme : mode
        invalid / missing / blocked storage → dark
      Runs in <head> with no deps/network so the first paint already matches
      the app chrome (no white flash on a dark default site).
    -->
    <script>
      (function () {
        var DARK = '#090909';
        var LIGHT = '#ffffff';
        var mode = 'dark';
        try {
          mode = localStorage.getItem('theme-mode') || 'dark';
        } catch (e) {
          mode = 'dark';
        }
        if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') {
          mode = 'dark';
        }
        var actual = mode;
        if (mode === 'auto') {
          try {
            actual =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          } catch (e) {
            actual = 'dark';
          }
        }
        var bg = actual === 'light' ? LIGHT : DARK;
        var root = document.documentElement;
        root.style.backgroundColor = bg;
        root.setAttribute('data-boot-theme', actual);
        if (actual === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
        // Paint body as soon as it exists (parser may not have reached it yet).
        function paintBody() {
          if (!document.body) return;
          document.body.style.backgroundColor = bg;
          if (actual === 'dark') {
            document.body.setAttribute('theme-mode', 'dark');
          } else {
            document.body.removeAttribute('theme-mode');
          }
        }
        if (document.body) paintBody();
        else
          document.addEventListener('DOMContentLoaded', paintBody, {
            once: true,
          });
      })();
    </script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="8701f14b-abd5-481a-ad21-8d0fb7abcd94"
      data-domains="vancine.com,www.vancine.com"
      data-do-not-track="true"
      data-performance="true"
    ></script>
    <!--Google Analytics-->
  </head>

  <body>
    <!--
      noscript sits ABOVE the boot layer (z-index 10000 > 9999) and is only
      rendered when JS is disabled, so the "enable JavaScript" message is
      never covered by #vancine-boot. When JS is on, the browser drops
      <noscript> entirely and the plain boot layer shows until React mounts.
    -->
    <noscript
      style="
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        text-align: center;
      "
      >You need to enable JavaScript to run this app.</noscript
    >
    <div id="root">
      <!--
        Plain boot layer shown while the JS bundle + first i18n language chunk
        load. No logo, no spinner, no loading copy — only a full-viewport solid
        color that matches the resolved app theme (see head sync script).
        React's createRoot(...).render() replaces #root's contents entirely, so
        this markup is gone the moment the app mounts. No exit animation, no
        minimum display time.
      -->
      <div
        id="vancine-boot"
        aria-hidden="true"
        style="position: fixed; inset: 0; background: #090909; z-index: 9999"
      ></div>
      <style>
        /* When the head script resolved light, override the dark default
           before first paint via the html[data-boot-theme] flag it sets. */
        html[data-boot-theme='light'] #vancine-boot {
          background: #ffffff !important;
        }
        html[data-boot-theme='dark'] #vancine-boot {
          background: #090909 !important;
        }
      </style>
    </div>
    <script type="module" src="/src/index.jsx"></script>
    <!-- Vancine brand theme override - must be last to override Semi Design defaults -->
    <style>
      body,
      body.semi-always-light {
        --semi-blue-0: 240, 238, 254 !important;
        --semi-blue-1: 228, 224, 253 !important;
        --semi-blue-2: 200, 192, 252 !important;
        --semi-blue-3: 170, 158, 250 !important;
        --semi-blue-4: 140, 125, 245 !important;
        --semi-blue-5: 108, 92, 231 !important;
        --semi-blue-6: 85, 65, 217 !important;
        --semi-blue-7: 68, 50, 180 !important;
        --semi-blue-8: 50, 38, 143 !important;
        --semi-blue-9: 35, 27, 107 !important;
      }
      body[theme-mode='dark'],
      html.dark body,
      body.semi-always-dark {
        --semi-blue-0: 35, 27, 107 !important;
        --semi-blue-1: 50, 38, 143 !important;
        --semi-blue-2: 68, 50, 180 !important;
        --semi-blue-3: 85, 65, 217 !important;
        --semi-blue-4: 108, 92, 231 !important;
        --semi-blue-5: 162, 155, 254 !important;
        --semi-blue-6: 184, 176, 254 !important;
        --semi-blue-7: 200, 192, 252 !important;
        --semi-blue-8: 228, 224, 253 !important;
        --semi-blue-9: 240, 238, 254 !important;
      }
    </style>
  </body>
</html>
